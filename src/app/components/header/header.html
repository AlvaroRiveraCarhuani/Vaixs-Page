<header class="main-header">
  <div class="brand">
    <img src="/images/logo.png" alt="Vaixs" class="brand-icon">
    <div class="brand-text">
      <span class="brand-title">V A I X S</span>
      <span class="brand-subtitle">VIRTUAL SOLUTIONS</span>
    </div>
  </div>

  <button class="mobile-menu-btn" (click)="toggleMenu()" [class.active]="isMenuOpen">
    <span></span><span></span><span></span>
  </button>

  <div class="nav-container" [class.open]="isMenuOpen">
    <nav class="nav-links">
      <a href="#inicio" (click)="closeMenu()">Inicio</a>
      <a href="#servicios" (click)="closeMenu()">Servicios</a>
      <a href="#productos" (click)="closeMenu()">Productos</a>
    </nav>
    <div class="header-actions">
      <a href="#contacto" class="btn-contacto" (click)="closeMenu()">Contacto</a>
    </div>
  </div>
</header>
